<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vertex.ai — Premium Auth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-layer" aria-hidden="true"></div>

    <main class="auth-shell">
      <section class="auth-card" aria-label="vertex.ai authentication card">
        <div class="top-row">
          <div class="icon-wrap" aria-hidden="true">
            <div class="icon-glow"></div>
            <div class="logo"></div>
          </div>
          <span class="status-pill">vertex.ai account</span>
        </div>

        <h1>vertex.ai</h1>
        <p class="subtitle">Welcome back. Continue securely.</p>

        <div class="auth-switch" role="tablist" aria-label="Authentication mode">
          <button id="loginTab" class="switch-btn active" type="button" role="tab" aria-selected="true">Login</button>
          <button id="signupTab" class="switch-btn" type="button" role="tab" aria-selected="false">Sign Up</button>
        </div>

        <form id="authForm" novalidate>
          <div id="nameWrap" class="hidden">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Your full name" />
          </div>

          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required />

          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" minlength="8" required />
          <label class="inline-check"><input type="checkbox" id="showPassword" /> Show password</label>

          <div id="confirmWrap" class="hidden">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="••••••••" minlength="8" />
            <label class="inline-check"><input type="checkbox" id="showConfirmPassword" /> Show confirm password</label>
          </div>

          <div class="form-row">
            <label class="inline-check"><input type="checkbox" id="rememberMe" /> Remember me</label>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>

          <button type="submit" id="submitBtn" class="sign-btn">Login</button>
        </form>

        <div class="divider"><span>OR CONTINUE WITH</span></div>

        <div class="social-grid">
          <button type="button" class="social-btn">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#EA4335" d="M12 10.2v3.9h5.5c-.2 1.2-1.4 3.6-5.5 3.6-3.3 0-6-2.7-6-6s2.7-6 6-6c1.9 0 3.2.8 3.9 1.5l2.7-2.6C17.2 3.1 14.9 2 12 2 6.5 2 2 6.5 2 12s4.5 10 10 10c5.8 0 9.6-4.1 9.6-9.8 0-.7-.1-1.3-.2-2H12z"/></svg>
            <span>Google</span>
          </button>
          <button type="button" class="social-btn">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16.37 1.43c0 1.14-.45 2.28-1.19 3.05-.83.87-1.98 1.52-3.15 1.44-.16-1.17.4-2.39 1.14-3.17.81-.85 2.17-1.48 3.2-1.32zM21.5 17.26c-.48 1.08-.71 1.56-1.32 2.5-.86 1.34-2.08 3.01-3.58 3.03-1.34.01-1.69-.87-3.5-.86-1.82.01-2.2.88-3.54.87-1.5-.02-2.66-1.52-3.52-2.86-2.4-3.7-2.65-8.04-1.17-10.32 1.05-1.62 2.72-2.56 4.29-2.56 1.6 0 2.62.88 3.95.88 1.29 0 2.08-.88 3.94-.88 1.4 0 2.88.76 3.93 2.06-3.45 1.9-2.89 6.82.52 8.14z"/></svg>
            <span>Apple</span>
          </button>
          <button type="button" class="social-btn">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 .5C5.65.5.5 5.68.5 12.07c0 5.1 3.3 9.43 7.87 10.96.58.11.79-.26.79-.57 0-.28-.01-1.02-.02-2-3.2.7-3.88-1.56-3.88-1.56-.52-1.34-1.28-1.7-1.28-1.7-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.2 1.77 1.2 1.04 1.8 2.72 1.28 3.38.98.1-.76.41-1.28.74-1.57-2.55-.29-5.23-1.29-5.23-5.75 0-1.27.45-2.3 1.2-3.11-.12-.3-.52-1.5.11-3.13 0 0 .98-.32 3.2 1.19a10.95 10.95 0 0 1 5.82 0c2.22-1.51 3.2-1.19 3.2-1.19.63 1.63.23 2.83.11 3.13.75.81 1.2 1.84 1.2 3.11 0 4.47-2.69 5.46-5.25 5.74.42.37.8 1.09.8 2.21 0 1.6-.01 2.9-.01 3.29 0 .31.2.69.8.57a11.56 11.56 0 0 0 7.85-10.96C23.5 5.68 18.35.5 12 .5z"/></svg>
            <span>GitHub</span>
          </button>
          <button type="button" class="social-btn">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#F35325" d="M1 1h10v10H1z"/><path fill="#81BC06" d="M13 1h10v10H13z"/><path fill="#05A6F0" d="M1 13h10v10H1z"/><path fill="#FFBA08" d="M13 13h10v10H13z"/></svg>
            <span>Microsoft</span>
          </button>
        </div>

        <p id="status" class="status" aria-live="polite"></p>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
