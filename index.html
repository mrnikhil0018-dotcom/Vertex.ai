<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vertex AI — Premium Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-layer" aria-hidden="true"></div>

    <main class="auth-shell">
      <section class="auth-card" aria-label="Sign in card">
        <div class="icon-wrap" aria-hidden="true">
          <div class="icon-glow"></div>
          <div class="logo">VA</div>
        </div>

        <p class="tag">LUXURY ACCESS</p>
        <h1>Sign in to Vertex AI</h1>
        <p class="subtitle">Black edition secure login experience.</p>

        <form id="loginForm" novalidate>
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required />

          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" minlength="8" required />

          <button type="submit" class="sign-btn">Sign In</button>
        </form>

        <p id="status" class="status" aria-live="polite"></p>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
