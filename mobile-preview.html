<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Premium Login - Mobile Preview</title>
    <style>
      :root {
        color-scheme: dark;
        --bg-1: #070714;
        --bg-2: #121230;
        --card: rgba(16, 18, 45, 0.88);
        --card-border: rgba(255, 255, 255, 0.16);
        --text-primary: #f2f5ff;
        --text-secondary: #a7b0c8;
        --accent: linear-gradient(135deg, #7f5cff 0%, #27d8ff 100%);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, Arial, sans-serif;
        color: var(--text-primary);
        background:
          radial-gradient(circle at 20% 15%, rgba(80, 67, 199, 0.35), transparent 30%),
          radial-gradient(circle at 80% 75%, rgba(0, 184, 255, 0.25), transparent 40%),
          linear-gradient(145deg, var(--bg-1), var(--bg-2));
        display: grid;
        place-items: center;
        padding: 16px;
      }
      .card {
        width: min(100%, 420px);
        background: var(--card);
        border: 1px solid var(--card-border);
        border-radius: 22px;
        padding: 20px;
        box-shadow: 0 25px 60px rgba(20, 26, 78, 0.55);
      }
      .logo {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: var(--accent);
        font-weight: 800;
        font-size: 12px;
      }
      h1 { font-size: 1.4rem; margin: 14px 0 6px; }
      p { color: var(--text-secondary); margin-top: 0; }
      label { display: grid; gap: 8px; margin: 14px 0; font-size: 14px; }
      input {
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 12px;
        background: rgba(10, 14, 32, 0.7);
        color: white;
        padding: 12px;
        font-size: 14px;
      }
      button {
        width: 100%;
        border: 0;
        border-radius: 12px;
        padding: 12px;
        font-weight: 700;
      }
      .primary { background: var(--accent); color: white; margin-top: 8px; }
      .secondary {
        background: rgba(255, 255, 255, 0.08);
        color: #f4f7ff;
        border: 1px solid rgba(255, 255, 255, 0.14);
        margin-top: 10px;
      }
      .status { min-height: 1.2em; text-align: center; margin-top: 10px; color: #6ef1a9; font-size: 14px; }
      .hint { margin-top: 14px; font-size: 12px; color: #c7d2ff; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo">AVA</div>
      <h1>Premium Login Preview</h1>
      <p>Mobile-friendly preview for your project UI.</p>

      <label>Email
        <input type="email" id="email" placeholder="you@example.com" />
      </label>
      <label>Password
        <input type="password" id="password" placeholder="••••••••" />
      </label>

      <button class="primary" id="signin">Sign in securely</button>
      <button class="secondary">Continue with Google</button>
      <p id="status" class="status"></p>
      <p class="hint">Tip: This file is standalone. Open directly on mobile browser.</p>
    </main>

    <script>
      document.getElementById('signin').addEventListener('click', function () {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const status = document.getElementById('status');
        if (!email || !password) {
          status.textContent = 'Email aur password daalo.';
          status.style.color = '#ffabab';
          return;
        }
        status.textContent = 'Preview working ✅ Backend next step.';
        status.style.color = '#6ef1a9';
      });
    </script>
  </body>
</html>
