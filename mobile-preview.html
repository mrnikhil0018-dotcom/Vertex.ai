<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vertex AI — Luxury Mobile Sign In</title>
    <style>
      :root {
        color-scheme: dark;
        --bg-black: #050506;
        --bg-deep: #0c0d12;
        --card: linear-gradient(165deg, rgba(18, 18, 24, 0.95), rgba(8, 8, 10, 0.96));
        --card-border: rgba(255, 255, 255, 0.14);
        --gold: #f9d17a;
        --soft: #a8afc8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, Arial, sans-serif;
        color: #f5f7ff;
        background:
          radial-gradient(circle at 20% 10%, rgba(143, 91, 255, 0.35), transparent 30%),
          radial-gradient(circle at 85% 90%, rgba(36, 212, 255, 0.2), transparent 35%),
          linear-gradient(150deg, var(--bg-black), var(--bg-deep));
        display: grid;
        place-items: center;
        padding: 16px;
      }
      .card {
        width: min(100%, 420px);
        border-radius: 22px;
        padding: 22px;
        background: var(--card);
        border: 1px solid var(--card-border);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(249, 209, 122, 0.14) inset;
      }
      .logo {
        width: 50px;
        height: 50px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        font-weight: 800;
        color: #120f05;
        background: linear-gradient(145deg, #ffe3a2, #f9d17a 60%, #ad7b1e);
        box-shadow: 0 6px 20px rgba(249, 209, 122, 0.38);
      }
      .tag {
        margin: 10px 0 6px;
        font-size: 11px;
        letter-spacing: 0.18em;
        color: #e8cb88;
        font-weight: 700;
      }
      h1 { margin: 0 0 6px; font-size: 1.4rem; }
      p { color: var(--soft); margin-top: 0; }
      label { display: block; margin-top: 12px; font-size: 14px; }
      input {
        width: 100%;
        margin-top: 8px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(0, 0, 0, 0.56);
        color: white;
        padding: 12px;
      }
      button {
        width: 100%;
        margin-top: 16px;
        border: 0;
        border-radius: 12px;
        padding: 12px;
        font-weight: 800;
        color: #111;
        background: linear-gradient(130deg, #ffe4a8, #f9d17a 45%, #9a69ff);
      }
      .status { min-height: 1.2em; text-align: center; margin-top: 10px; color: #6cf5ad; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo">VA</div>
      <p class="tag">LUXURY ACCESS</p>
      <h1>Sign in</h1>
      <p>Premium black theme mobile login.</p>

      <label>Email
        <input type="email" id="email" placeholder="you@example.com" />
      </label>
      <label>Password
        <input type="password" id="password" placeholder="••••••••" />
      </label>

      <button id="signin">Sign In</button>
      <p id="status" class="status"></p>
    </main>

    <script>
      document.getElementById('signin').addEventListener('click', function () {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const status = document.getElementById('status');

        if (!email || !password) {
          status.textContent = 'Email aur password daalo.';
          status.style.color = '#ff9595';
          return;
        }

        status.textContent = 'Sign in successful ✅';
        status.style.color = '#6cf5ad';
      });
    </script>
  </body>
</html>
