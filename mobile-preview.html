<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vertex.ai — Mobile Auth</title>
    <style>
      :root {
        color-scheme: dark;
        --bg-black: #050506;
        --bg-deep: #0c0d12;
        --card: linear-gradient(165deg, rgba(18, 18, 24, 0.95), rgba(8, 8, 10, 0.96));
        --card-border: rgba(255, 255, 255, 0.14);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, Arial, sans-serif;
        color: #f5f7ff;
        background:
          radial-gradient(circle at 20% 10%, rgba(143, 91, 255, 0.35), transparent 30%),
          radial-gradient(circle at 85% 90%, rgba(36, 212, 255, 0.2), transparent 35%),
          linear-gradient(150deg, var(--bg-black), var(--bg-deep));
        display: grid;
        place-items: center;
        padding: 16px;
      }
      .card {
        width: min(100%, 430px);
        border-radius: 22px;
        padding: 22px;
        background: var(--card);
        border: 1px solid var(--card-border);
      }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .logo {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        background: radial-gradient(circle at 35% 30%, #fff1c8 6%, #f9d17a 35%, #8f5bff 100%);
      }
      .pill {
        border: 1px solid rgba(249, 209, 122, 0.34);
        background: rgba(249, 209, 122, 0.08);
        color: #f5d38a;
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 11px;
      }
      h1 { margin: 10px 0 4px; text-transform: lowercase; }
      .subtitle { color: #a8afc8; margin-top: 0; }
      .switch { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
      .tab {
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.04);
        color: #e7ebff;
        padding: 10px;
        font-weight: 700;
      }
      .tab.active {
        color: #111;
        border-color: transparent;
        background: linear-gradient(130deg, #ffe4a8, #f9d17a 45%, #9a69ff);
      }
      label { display: block; margin-top: 12px; font-size: 14px; }
      input {
        width: 100%;
        margin-top: 8px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(0, 0, 0, 0.56);
        color: white;
        padding: 12px;
      }
      .hidden { display: none; }
      .inline-check { display: flex; align-items: center; gap: 8px; color: #c7cee3; font-size: 12px; margin-top: 8px; }
      .inline-check input { width: auto; margin: 0; }
      .form-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; }
      .forgot { color: #9fd8ff; text-decoration: none; font-size: 12px; }
      .primary {
        width: 100%;
        margin-top: 16px;
        border: 0;
        border-radius: 12px;
        padding: 12px;
        font-weight: 800;
        color: #111;
        background: linear-gradient(130deg, #ffe4a8, #f9d17a 45%, #9a69ff);
      }
      .divider { margin: 14px 0 10px; color: #aab0c8; text-align: center; font-size: 11px; letter-spacing: 0.1em; }
      .social { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .social button {
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.04);
        color: #f2f5ff;
        padding: 10px;
        font-weight: 700;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 7px;
      }
      .social svg { width: 16px; height: 16px; }
      .status { min-height: 1.2em; text-align: center; margin-top: 10px; color: #6cf5ad; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="row">
        <div class="logo"></div>
        <span class="pill">vertex.ai account</span>
      </div>
      <h1>vertex.ai</h1>
      <p class="subtitle">Welcome back. Continue securely.</p>

      <div class="switch">
        <button id="mLogin" class="tab active" type="button">Login</button>
        <button id="mSignup" class="tab" type="button">Sign Up</button>
      </div>

      <div id="mNameWrap" class="hidden">
        <label>Full Name
          <input type="text" id="name" placeholder="Your full name" />
        </label>
      </div>

      <label>Email
        <input type="email" id="email" placeholder="you@example.com" />
      </label>
      <label>Password
        <input type="password" id="password" placeholder="••••••••" />
      </label>
      <label class="inline-check"><input type="checkbox" id="showPassword" /> Show password</label>

      <div id="mConfirmWrap" class="hidden">
        <label>Confirm Password
          <input type="password" id="confirmPassword" placeholder="••••••••" />
        </label>
        <label class="inline-check"><input type="checkbox" id="showConfirmPassword" /> Show confirm password</label>
      </div>

      <div class="form-row">
        <label class="inline-check"><input type="checkbox" /> Remember me</label>
        <a href="#" class="forgot">Forgot password?</a>
      </div>

      <button id="submit" class="primary">Login</button>

      <div class="divider">OR CONTINUE WITH</div>
      <div class="social">
        <button type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#EA4335" d="M12 10.2v3.9h5.5c-.2 1.2-1.4 3.6-5.5 3.6-3.3 0-6-2.7-6-6s2.7-6 6-6c1.9 0 3.2.8 3.9 1.5l2.7-2.6C17.2 3.1 14.9 2 12 2 6.5 2 2 6.5 2 12s4.5 10 10 10c5.8 0 9.6-4.1 9.6-9.8 0-.7-.1-1.3-.2-2H12z"/></svg>Google</button>
        <button type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16.37 1.43c0 1.14-.45 2.28-1.19 3.05-.83.87-1.98 1.52-3.15 1.44-.16-1.17.4-2.39 1.14-3.17.81-.85 2.17-1.48 3.2-1.32zM21.5 17.26c-.48 1.08-.71 1.56-1.32 2.5-.86 1.34-2.08 3.01-3.58 3.03-1.34.01-1.69-.87-3.5-.86-1.82.01-2.2.88-3.54.87-1.5-.02-2.66-1.52-3.52-2.86-2.4-3.7-2.65-8.04-1.17-10.32 1.05-1.62 2.72-2.56 4.29-2.56 1.6 0 2.62.88 3.95.88 1.29 0 2.08-.88 3.94-.88 1.4 0 2.88.76 3.93 2.06-3.45 1.9-2.89 6.82.52 8.14z"/></svg>Apple</button>
        <button type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 .5C5.65.5.5 5.68.5 12.07c0 5.1 3.3 9.43 7.87 10.96.58.11.79-.26.79-.57 0-.28-.01-1.02-.02-2-3.2.7-3.88-1.56-3.88-1.56-.52-1.34-1.28-1.7-1.28-1.7-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.2 1.77 1.2 1.04 1.8 2.72 1.28 3.38.98.1-.76.41-1.28.74-1.57-2.55-.29-5.23-1.29-5.23-5.75 0-1.27.45-2.3 1.2-3.11-.12-.3-.52-1.5.11-3.13 0 0 .98-.32 3.2 1.19a10.95 10.95 0 0 1 5.82 0c2.22-1.51 3.2-1.19 3.2-1.19.63 1.63.23 2.83.11 3.13.75.81 1.2 1.84 1.2 3.11 0 4.47-2.69 5.46-5.25 5.74.42.37.8 1.09.8 2.21 0 1.6-.01 2.9-.01 3.29 0 .31.2.69.8.57a11.56 11.56 0 0 0 7.85-10.96C23.5 5.68 18.35.5 12 .5z"/></svg>GitHub</button>
        <button type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#F35325" d="M1 1h10v10H1z"/><path fill="#81BC06" d="M13 1h10v10H13z"/><path fill="#05A6F0" d="M1 13h10v10H1z"/><path fill="#FFBA08" d="M13 13h10v10H13z"/></svg>Microsoft</button>
      </div>

      <p id="status" class="status"></p>
    </main>

    <script>
      let mode = 'login';
      const loginBtn = document.getElementById('mLogin');
      const signupBtn = document.getElementById('mSignup');
      const submitBtn = document.getElementById('submit');
      const confirmWrap = document.getElementById('mConfirmWrap');
      const nameWrap = document.getElementById('mNameWrap');
      const status = document.getElementById('status');
      const password = document.getElementById('password');
      const confirmPassword = document.getElementById('confirmPassword');

      document.getElementById('showPassword').addEventListener('change', (e) => {
        password.type = e.target.checked ? 'text' : 'password';
      });

      document.getElementById('showConfirmPassword').addEventListener('change', (e) => {
        confirmPassword.type = e.target.checked ? 'text' : 'password';
      });

      function setMode(next) {
        mode = next;
        const isSignup = mode === 'signup';
        loginBtn.classList.toggle('active', !isSignup);
        signupBtn.classList.toggle('active', isSignup);
        confirmWrap.classList.toggle('hidden', !isSignup);
        nameWrap.classList.toggle('hidden', !isSignup);
        submitBtn.textContent = isSignup ? 'Create Account' : 'Login';
        status.textContent = '';
      }

      loginBtn.addEventListener('click', () => setMode('login'));
      signupBtn.addEventListener('click', () => setMode('signup'));

      submitBtn.addEventListener('click', function () {
        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const pwd = password.value;
        const cpwd = confirmPassword.value;

        if (!email || !pwd) {
          status.textContent = 'Email aur password daalo.';
          status.style.color = '#ff9595';
          return;
        }

        if (mode === 'signup' && !name) {
          status.textContent = 'Name bhi add karo.';
          status.style.color = '#ff9595';
          return;
        }

        if (pwd.length < 8) {
          status.textContent = 'Password minimum 8 characters.';
          status.style.color = '#ff9595';
          return;
        }

        if (mode === 'signup' && pwd !== cpwd) {
          status.textContent = 'Passwords match nahi kar rahe.';
          status.style.color = '#ff9595';
          return;
        }

        status.textContent = mode === 'signup' ? `Account created ✅ Welcome, ${name}` : 'Login successful ✅';
        status.style.color = '#6cf5ad';
      });
    </script>
  </body>
</html>
