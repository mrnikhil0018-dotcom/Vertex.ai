<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vertex.ai — Mobile Auth</title>
    <style>
      :root {
        color-scheme: dark;
        --bg-black: #050506;
        --bg-deep: #0c0d12;
        --card: linear-gradient(165deg, rgba(18, 18, 24, 0.95), rgba(8, 8, 10, 0.96));
        --card-border: rgba(255, 255, 255, 0.14);
        --gold: #f9d17a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, Arial, sans-serif;
        color: #f5f7ff;
        background:
          radial-gradient(circle at 20% 10%, rgba(143, 91, 255, 0.35), transparent 30%),
          radial-gradient(circle at 85% 90%, rgba(36, 212, 255, 0.2), transparent 35%),
          linear-gradient(150deg, var(--bg-black), var(--bg-deep));
        display: grid;
        place-items: center;
        padding: 16px;
      }
      .card {
        width: min(100%, 430px);
        border-radius: 22px;
        padding: 22px;
        background: var(--card);
        border: 1px solid var(--card-border);
      }
      .logo {
        width: 50px;
        height: 50px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        font-weight: 800;
        color: #120f05;
        background: linear-gradient(145deg, #ffe3a2, #f9d17a 60%, #ad7b1e);
      }
      h1 { margin: 10px 0 4px; text-transform: lowercase; }
      .subtitle { color: #a8afc8; margin-top: 0; }
      .switch {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 10px;
      }
      .tab {
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.04);
        color: #e7ebff;
        padding: 10px;
        font-weight: 700;
      }
      .tab.active {
        color: #111;
        border-color: transparent;
        background: linear-gradient(130deg, #ffe4a8, #f9d17a 45%, #9a69ff);
      }
      label { display: block; margin-top: 12px; font-size: 14px; }
      input {
        width: 100%;
        margin-top: 8px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(0, 0, 0, 0.56);
        color: white;
        padding: 12px;
      }
      .hidden { display: none; }
      .primary {
        width: 100%;
        margin-top: 16px;
        border: 0;
        border-radius: 12px;
        padding: 12px;
        font-weight: 800;
        color: #111;
        background: linear-gradient(130deg, #ffe4a8, #f9d17a 45%, #9a69ff);
      }
      .divider {
        margin: 14px 0 10px;
        color: #aab0c8;
        text-align: center;
        font-size: 11px;
        letter-spacing: 0.1em;
      }
      .social {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .social button {
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.04);
        color: #f2f5ff;
        padding: 10px;
        font-weight: 700;
      }
      .status { min-height: 1.2em; text-align: center; margin-top: 10px; color: #6cf5ad; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo">VA</div>
      <h1>vertex.ai</h1>
      <p class="subtitle">Secure premium access.</p>

      <div class="switch">
        <button id="mLogin" class="tab active" type="button">Login</button>
        <button id="mSignup" class="tab" type="button">Sign Up</button>
      </div>

      <label>Email
        <input type="email" id="email" placeholder="you@example.com" />
      </label>
      <label>Password
        <input type="password" id="password" placeholder="••••••••" />
      </label>
      <div id="mConfirmWrap" class="hidden">
        <label>Confirm Password
          <input type="password" id="confirmPassword" placeholder="••••••••" />
        </label>
      </div>

      <button id="submit" class="primary">Login</button>

      <div class="divider">OR CONTINUE WITH</div>
      <div class="social">
        <button type="button">Google</button>
        <button type="button">GitHub</button>
        <button type="button">Apple</button>
        <button type="button">Microsoft</button>
      </div>

      <p id="status" class="status"></p>
    </main>

    <script>
      let mode = 'login';
      const loginBtn = document.getElementById('mLogin');
      const signupBtn = document.getElementById('mSignup');
      const submitBtn = document.getElementById('submit');
      const confirmWrap = document.getElementById('mConfirmWrap');
      const status = document.getElementById('status');

      function setMode(next) {
        mode = next;
        const isSignup = mode === 'signup';
        loginBtn.classList.toggle('active', !isSignup);
        signupBtn.classList.toggle('active', isSignup);
        confirmWrap.classList.toggle('hidden', !isSignup);
        submitBtn.textContent = isSignup ? 'Create Account' : 'Login';
        status.textContent = '';
      }

      loginBtn.addEventListener('click', () => setMode('login'));
      signupBtn.addEventListener('click', () => setMode('signup'));

      submitBtn.addEventListener('click', function () {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (!email || !password) {
          status.textContent = 'Email aur password daalo.';
          status.style.color = '#ff9595';
          return;
        }

        if (password.length < 8) {
          status.textContent = 'Password minimum 8 characters.';
          status.style.color = '#ff9595';
          return;
        }

        if (mode === 'signup' && password !== confirmPassword) {
          status.textContent = 'Passwords match nahi kar rahe.';
          status.style.color = '#ff9595';
          return;
        }

        status.textContent = mode === 'signup' ? 'Account created ✅' : 'Login successful ✅';
        status.style.color = '#6cf5ad';
      });
    </script>
  </body>
</html>
